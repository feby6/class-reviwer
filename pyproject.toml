[project]
name = "humaniti"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "google-genai>=2.32.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
